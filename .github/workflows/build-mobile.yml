name: Build Mobile (Android .apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile:
    name: Build Android Client (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias (Ignorar Conflictos Peer)
        run: npm install --legacy-peer-deps

      # PASO 1: Compilar Vite ANTES de cualquier comando de Capacitor
      - name: Compilar Frontend Vite (Generar carpetas dist y www)
        run: |
          npm run build
          # Salvaguarda: duplicar dist a www para que Capacitor siempre encuentre los assets
          mkdir -p www
          cp -r dist/* www/

      # PASO 2: Forzar configuracion de Capacitor y sincronizar con Android
      - name: Configurar y Sincronizar Capacitor con Android
        run: |
          # Asegurar que capacitor.config.json apunte a dist
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.zeus.streamdeck",
            "appName": "Zeus Stream Deck",
            "webDir": "dist"
          }
          EOF

          # Si no existe la carpeta android, agregar la plataforma
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Sincronizar los assets compilados
          npx cap sync android

      # PASO 3: Compilar el APK con Gradle
      - name: Compilar APK con Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      # PASO 4: Mover el APK a la carpeta de artefactos
      - name: Renombrar APK para Release
        run: |
          mkdir -p release-artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-artifacts/ZeusStreamDeck.apk \;

      # PASO 5: Publicar APK en la Release de GitHub
      - name: Subir APK a Release de GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/ZeusStreamDeck.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/ZeusStreamDeck.apk