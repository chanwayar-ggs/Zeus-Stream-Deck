name: Build Mobile (Android .apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile:
    name: Build Android Client (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias (Ignorar Conflictos Peer)
        run: npm install --legacy-peer-deps

      # PASO CLAVE: Compilación previa de Vite para que exista la carpeta 'dist'
      - name: Compilar Frontend Vite (Generar carpeta dist)
        run: npm run build

      # Sincronización de Capacitor una vez que 'dist' ya existe
      - name: Sincronizar Assets con Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Renombrar APK para Release
        run: |
          mkdir -p release-artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-artifacts/ZeusStreamDeck.apk \;

      - name: Subir APK a Release de GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/ZeusStreamDeck.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/ZeusStreamDeck.apk