name: Release Zeus Stream Deck (PC & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # JOB 1: Compilar la Aplicación de PC (Windows .exe)
  # ========================================================
  build-desktop:
    name: Build Windows Host (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias (Legacy Peer Deps)
        run: npm install --legacy-peer-deps

      - name: Compilar Frontend Web
        run: npm run build

      - name: Compilar Instalador con electron-builder
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Renombrar Ejecutable para Release
        shell: bash
        run: |
          mkdir -p release-artifacts
          find dist* -maxdepth 2 -name "*.exe" -exec cp {} release-artifacts/ZeusStreamDeck-Setup.exe \; || cp dist/*.exe release-artifacts/ZeusStreamDeck-Setup.exe

      - name: Subir Instalador de PC a Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-artifacts/ZeusStreamDeck-Setup.exe

  # ========================================================
  # JOB 2: Compilar la Aplicación Móvil (Android .apk)
  # ========================================================
  build-mobile:
    name: Build Android Client (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias (Legacy Peer Deps)
        run: npm install --legacy-peer-deps

      - name: Compilar Frontend React (Vite)
        run: npm run build

      - name: Sincronizar Assets con Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            cd android
            ./gradlew assembleRelease
            cd ..
          fi

      - name: Renombrar APK para Release
        run: |
          mkdir -p release-artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-artifacts/ZeusStreamDeck.apk \; || cp android/app/build/outputs/apk/release/*.apk release-artifacts/ZeusStreamDeck.apk

      - name: Subir APK a Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/ZeusStreamDeck.apk

  # ========================================================
  # JOB 3: Publicar Release Oficial en GitHub
  # ========================================================
  publish-release:
    name: Publicar Release Oficial en GitHub
    needs: [build-desktop, build-mobile]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Descargar Instalador de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Descargar APK de Android
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Crear Release en GitHub con los Binarios
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZeusStreamDeck-Setup.exe
            ZeusStreamDeck.apk
          name: Zeus Stream Deck ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}