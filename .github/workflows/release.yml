name: Release Zeus Stream Deck (PC & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # JOB 1: Compilar la Aplicación de PC (Windows .exe)
  # ========================================================
  build-desktop:
    name: Build Windows Host (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias del Host
        run: |
          cd desktop
          npm ci || npm install

      - name: Compilar Instalador NSIS con electron-builder
        run: |
          cd desktop
          npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Renombrar Ejecutable para Release
        shell: bash
        run: |
          mv desktop/dist/*.exe desktop/dist/ZeusStreamDeck-Setup.exe

      - name: Subir Instalador de PC a Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/dist/ZeusStreamDeck-Setup.exe

  # ========================================================
  # JOB 2: Compilar la Aplicación Móvil (Android .apk)
  # ========================================================
  build-mobile:
    name: Build Android Client (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias del Móvil
        run: |
          cd mobile
          npm ci || npm install

      - name: Compilar Frontend React (Vite)
        run: |
          cd mobile
          npm run build

      - name: Sincronizar Assets con Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: |
          chmod +x mobile/android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd mobile/android
          ./gradlew assembleRelease

      - name: Renombrar APK para Release
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk ZeusStreamDeck.apk || cp mobile/android/app/build/outputs/apk/release/app-release.apk ZeusStreamDeck.apk

      - name: Subir APK a Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ZeusStreamDeck.apk

  # ========================================================
  # JOB 3: Publicar Release Oficial en GitHub
  # ========================================================
  publish-release:
    name: Publicar Release Oficial en GitHub
    needs: [build-desktop, build-mobile]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Descargar Instalador de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Descargar APK de Android
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Crear Release en GitHub con los Binarios
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZeusStreamDeck-Setup.exe
            ZeusStreamDeck.apk
          name: Zeus Stream Deck ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
